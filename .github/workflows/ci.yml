name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality, migration, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: yance
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: yance_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yance -d yance_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://yance:ci_password@localhost:5432/yance_ci
      YANCE_TEST_DATABASE_ACK: yance_ci
      JWT_SECRET: ci-only-secret-at-least-32-characters
      API_KEY_PEPPER: ci-only-api-key-pepper-at-least-32-characters
      BOOTSTRAP_TOKEN: ci-only-bootstrap-token
      TENANT_PROVISIONING_TOKEN: ci-only-tenant-provisioning-token
    defaults:
      run:
        working-directory: yance-ai
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: yance-ai/pyproject.toml

      - name: Install backend and test dependencies
        run: python -m pip install --disable-pip-version-check -c constraints-release.txt -e ".[dev]"

      - name: Lint
        run: ruff check app tests alembic

      - name: Compile
        run: python -m compileall -q app

      - name: Check OpenAPI contract snapshot
        run: python scripts/export_openapi.py --check

      - name: Apply all migrations
        run: alembic upgrade head

      - name: Verify one-revision rollback and forward migration
        run: |
          alembic downgrade -1
          alembic upgrade head

      - name: Check model and migration alignment
        run: alembic check

      - name: Run backend tests with coverage floor
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=50

      - name: Run explicit API and worker golden-journey gate
        env:
          DATABASE_URL: postgresql+psycopg://yance:ci_password@localhost:5432/yance_golden_ci
          YANCE_TEST_DATABASE_ACK: yance_golden_ci
          PGPASSWORD: ci_password
        run: |
          createdb --host localhost --username yance yance_golden_ci
          alembic upgrade head
          pytest -m e2e --no-cov

      - name: Run five-part deterministic evaluation gate
        run: python evals/run_evals.py run --no-persist

      - name: Run bounded API latency smoke
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/yance-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              break
            fi
            sleep 1
          done
          python scripts/load_smoke.py --url http://127.0.0.1:8000/health --requests 50 --concurrency 5 --max-p95-ms 750

      - name: Verify logical backup and isolated restore
        env:
          PGPASSWORD: ci_password
        run: |
          pg_dump --host localhost --username yance --dbname yance_ci --format custom --file "$RUNNER_TEMP/yance-ci.dump"
          createdb --host localhost --username yance yance_restore_ci
          pg_restore --host localhost --username yance --dbname yance_restore_ci --exit-on-error "$RUNNER_TEMP/yance-ci.dump"
          psql --host localhost --username yance --dbname yance_restore_ci --command 'SELECT version_num FROM alembic_version;'

  frontend:
    name: Frontend audit, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify interaction guards and artifact comparison
        run: npm run test:unit

      - name: Build production application
        run: npm run build

      - name: Verify standalone runtime artifact
        run: test -f .next/standalone/server.js

  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: yance-ai
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: yance-ai/pyproject.toml

      - name: Install application and auditor
        run: python -m pip install --disable-pip-version-check -c constraints-release.txt -e . "pip-audit>=2.9,<3"

      - name: Audit installed dependencies
        run: pip-audit --local --skip-editable

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan committed history for secrets
        # The CLI needs no GitHub token or PR commenting permissions. Scan all
        # history with full redaction; exact reviewed false positives are listed
        # in .gitleaksignore, rather than disabling rules or skipping paths.
        run: |
          docker pull ghcr.io/gitleaks/gitleaks:v8.30.1
          docker run --rm --network none --volume "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo \
            --no-banner --redact=100 --log-opts="--all" \
            --gitleaks-ignore-path /repo/.gitleaksignore

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: yance-ai
          - name: frontend
            context: website
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build ${{ matrix.name }} image
        run: docker build --tag "yance-${{ matrix.name }}:ci" "${{ matrix.context }}"

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          image: "yance-${{ matrix.name }}:ci"
          format: spdx-json
          output-file: "sbom-${{ matrix.name }}.spdx.json"
          artifact-name: "sbom-${{ matrix.name }}.spdx.json"

      - name: Scan image for fixed high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "yance-${{ matrix.name }}:ci"
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

      - name: Verify runtime user is non-root
        run: |
          runtime_user=$(docker image inspect "yance-${{ matrix.name }}:ci" --format '{{.Config.User}}')
          test -n "$runtime_user"
          test "$runtime_user" != "0"

      - name: Verify backend OCR runtime
        if: matrix.name == 'backend'
        run: |
          docker run --rm "yance-${{ matrix.name }}:ci" python -c "import pymupdf; print(pymupdf.__version__)"
          docker run --rm --entrypoint tesseract "yance-${{ matrix.name }}:ci" --list-langs | grep -F chi_sim
          docker run --rm --entrypoint tesseract "yance-${{ matrix.name }}:ci" --list-langs | grep -F eng

  browser-e2e:
    name: Browser product journeys
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: yance
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: yance_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yance -d yance_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://yance:ci_password@localhost:5432/yance_e2e
      YANCE_TEST_DATABASE_ACK: yance_e2e
      JWT_SECRET: ci-only-secret-at-least-32-characters
      API_KEY_PEPPER: ci-only-api-key-pepper-at-least-32-characters
      BOOTSTRAP_TOKEN: ci-only-bootstrap-token
      TENANT_PROVISIONING_TOKEN: ci-only-tenant-provisioning-token
      DEMO_FEATURES_ENABLED: "true"
      CORS_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8011/api/v1
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      PLAYWRIGHT_API_BASE_URL: http://localhost:8011/api/v1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: yance-ai/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install locked application dependencies
        run: |
          python -m pip install --disable-pip-version-check -c yance-ai/constraints-release.txt -e "./yance-ai[dev]"
          npm ci --prefix website

      - name: Migrate and seed synthetic demo dataset
        working-directory: yance-ai
        run: |
          alembic upgrade head
          python scripts/seed_investor_demo.py

      - name: Seed isolated evidence workspace fixture
        working-directory: yance-ai
        run: |
          python tests/seed_v2_browser.py "$RUNNER_TEMP/yance-v2-browser-fixture.json"
          echo "YANCE_V2_FIXTURE=$RUNNER_TEMP/yance-v2-browser-fixture.json" >> "$GITHUB_ENV"
          python tests/seed_v2_browser.py "$RUNNER_TEMP/yance-roles-fixture.json"
          echo "YANCE_ROLES_FIXTURE=$RUNNER_TEMP/yance-roles-fixture.json" >> "$GITHUB_ENV"

      - name: Install Chromium runtime
        working-directory: website
        run: npx playwright install --with-deps chromium

      - name: Start API
        working-directory: yance-ai
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8011 > "$RUNNER_TEMP/yance-e2e-api.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8011/health/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/yance-e2e-api.log"
          exit 1

      - name: Run Chromium product E2E
        working-directory: website
        run: npm run test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: website/playwright-report
          if-no-files-found: ignore
