notes: |
  首批国家高新区目录，与国家/省级/重点 30 城政策来源目录对齐，每城取一个代表性国家高新区。

  登记口径（必须逐条阅读，不得当作已验证事实）：
    - designation_basis 只陈述“国务院批复设立的国家高新技术产业开发区”这一层级事实，
      不填写未经本轮核验的批复文号；文号与批次须在核验后补录。
    - district（区县）在本轮刻意留空：国家高新区的实际管辖范围普遍为“一区多园”或跨区，
      从园区名称反推区县属于不可靠裁剪。boundary_status 统一为 needs_confirmation。
    - official_url 只填写有较高把握的官方域名，其余留空，避免猜测路径。
    - verification_status 含义：
        registered        已登记，本轮未做网络核验
        reachable        本机探针可访问官网首页（2026-11-06）
        metadata_verified 已与官方名录页面核对名称与行政区划
        unreachable      本机探针不可访问（DNS/超时/4xx），生产侧待复核
    - 本机探针结果不代表生产服务器可达性；生产侧需重新核验。

  “园区所在地”不等于“园区政策适用范围”：企业注册或实际经营在园区所在行政区划，
  并不自动构成享受园区专属政策的条件。适用范围一律由 park_policy_scopes 依据原文登记。

