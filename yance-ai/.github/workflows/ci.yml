name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: yance
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: yance_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yance -d yance_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://yance:ci_password@localhost:5432/yance_ci
      JWT_SECRET: ci-only-secret-at-least-32-characters
      BOOTSTRAP_TOKEN: ci-only-bootstrap-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m compileall -q app
      - run: alembic upgrade head
      - run: pytest --cov=app --cov-report=term-missing
      - run: python evals/run_evals.py --cases evals/golden_cases/policy_matching.jsonl
      - run: docker build -t yance-api:ci .

