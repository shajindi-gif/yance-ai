name: yance-prod

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yance_prod}
      POSTGRES_USER: ${POSTGRES_USER:-yance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - yance_pgdata_prod:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yance} -d ${POSTGRES_DB:-yance_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    env_file: .env.prod
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    env_file: .env.prod
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - yance_invoices_prod:/app/invoices
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  agent-worker:
    build: .
    env_file: .env.prod
    command: ["python", "-m", "app.workers.agent_worker"]
    volumes:
      - yance_invoices_prod:/app/invoices
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Worker 是轮询进程且镜像为精简版（无 ps/pgrep），用 Python 检查 PID 1 命令行
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if 'agent_worker' in open('/proc/1/cmdline','rb').read().decode() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  document-worker:
    profiles: ["documents"] # OSS 未配置前不默认启动，启用需 --profile documents
    build: .
    env_file: .env.prod
    command: ["python", "-m", "app.workers.document_worker"]
    volumes:
      - yance_invoices_prod:/app/invoices
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if 'document_worker' in open('/proc/1/cmdline','rb').read().decode() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  notification-worker:
    profiles: ["notifications"] # 仅经邮件供应商验收后显式启用
    build: .
    env_file: .env.prod
    command: ["python", "-m", "app.workers.notification_worker"]
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if 'notification_worker' in open('/proc/1/cmdline','rb').read().decode() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamav_database_prod:/var/lib/clamav

volumes:
  yance_pgdata_prod:
  yance_invoices_prod:
  clamav_database_prod:
