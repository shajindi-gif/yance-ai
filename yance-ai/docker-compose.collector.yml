# Standalone collector — runs the continuous policy collection beside the app.
#
# Why a separate compose file instead of one more service in docker-compose.prod.yml:
#   the collector must be able to start, stop, pause and be resource-capped without
#   touching the API/login/payment containers.  Coupling it to the app stack means a
#   runaway crawl is one `docker compose up` away from competing with auth traffic.
#
# Usage (from the repo root, where .env.prod lives):
#   docker compose -f docker-compose.collector.yml --env-file .env.prod up -d
#   docker compose -f docker-compose.collector.yml logs -f collector
#   docker compose -f docker-compose.collector.yml down          # stop the loop
#
# It joins the app's network as an *external* network, so the database service keeps
# its own lifecycle: this file never creates, migrates or upgrades the database.

name: yance-collector

services:
  collector:
    build:
      context: .
      dockerfile: Dockerfile
    image: yance-ai:collector
    env_file: .env.prod
    environment:
      # The master switch.  With it off every scheduling cycle reports
      # collection_disabled and downloads nothing, which is the safe default.
      POLICY_COLLECTION_ENABLED: "true"
      # Raw bytes live on a named volume, never inside the container layer: a
      # container is replaceable, evidence is not.
      POLICY_COLLECTION_RAW_DIR: /app/policy_raw
      POLICY_COLLECTION_ATTACHMENT_DIR: /app/policy_raw/attachments
      # Stop *new* downloads below this free space instead of filling the disk.
      POLICY_COLLECTION_MIN_FREE_DISK_MB: "3000"
      # Leave the loop budget below the stop grace period so a `down` never
      # truncates a document in flight.
      POLICY_COLLECTION_SCHEDULER_CYCLE_SECONDS: "600"
      POLICY_COLLECTION_SCHEDULER_INTERVAL_SECONDS: "300"
      # Production must NOT relax the SSRF guard; this stays empty on purpose.
      POLICY_COLLECTION_DNS_PROXY_CIDRS: ""
    command:
      - python
      - -m
      - app.workers.policy_collector
    volumes:
      - yance_policy_raw_prod:/app/policy_raw
    networks:
      - yance_app
    restart: unless-stopped
    # ---- resource ceiling -------------------------------------------------
    # A crawl must never take CPU or RAM away from login/payment/reports.  These
    # are hard limits: exceeding them throttles the collector, not the app.
    cpus: "1.0"
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 256
    # Let the current document finish and the cursor be committed.
    stop_grace_period: 120s
    # ---- health -----------------------------------------------------------
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json, pathlib, sys, time
          p = pathlib.Path("/app/policy_raw/collector_state.json")
          if not p.exists():
              sys.exit(0)  # first cycle has not finished yet
          try:
              state = json.loads(p.read_text())
              beat = state.get("last_cycle_at") or ""
          except Exception:
              sys.exit(1)
          sys.exit(0 if beat else 1)
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  # Persisted separately from the app's volumes so a `docker compose down -v` of
  # the app stack cannot delete collected evidence.
  yance_policy_raw_prod:
    name: yance_policy_raw_prod

networks:
  yance_app:
    external: true
    name: yance-prod_default
