name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: summary
    attributes: {label: Summary, description: What happened?}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Steps to reproduce, description: Include environment and test data IDs, never secrets.}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Version, placeholder: v0.1.0}
    validations: {required: true}
  - type: dropdown
    id: environment
    attributes: {label: Environment, options: [Development, Staging, Production]}
    validations: {required: true}

