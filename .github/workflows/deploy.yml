name: Deploy

# Manual + push-to-main deploy. Requires repository secrets:
#   DEPLOY_SSH_HOST   server hostname or IP reachable from GitHub runners
#   DEPLOY_SSH_USER   ssh user (e.g. ubuntu)
#   DEPLOY_SSH_KEY    private key (PEM) for the deploy user
# If the server is only reachable through a Cloudflare Tunnel (no inbound 22),
# expose a dedicated SSH ingress (cloudflared access token) or run the same
# steps from a self-hosted runner inside the tunnel. See docs/DEPLOYMENT.md.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify before deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: yance-ai/pyproject.toml
      - name: Install backend deps
        run: pip install -e "yance-ai[dev]" 2>/dev/null || pip install -r <(python -c "import tomllib,pathlib;d=tomllib.loads(pathlib.Path('yance-ai/pyproject.toml').read_text());print('\n'.join(d['project']['dependencies']))")
      - name: Backend tests
        env:
          DATABASE_URL: postgresql+psycopg://yance:yance@localhost:5432/yance_test
        run: |
          cd yance-ai
          python -m alembic upgrade head
          python -m pytest tests/ -q
      - name: Frontend typecheck + build
        working-directory: website
        run: |
          npm ci
          npm run typecheck
          npm run build

  deploy:
    name: Deploy to production
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Sync code to server
        env:
          SSH: "ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}"
        run: |
          tar czf - yance-ai/app yance-ai/alembic yance-ai/pyproject.toml website/app website/lib website/components website/public website/next.config.js \
            | $SSH "cd /opt/yance && tar xzf -"
      - name: Build and restart on server
        env:
          SSH: "ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}"
        run: |
          $SSH 'set -e
            cd /opt/yance/yance-ai
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build api agent-worker
            cd /opt/yance/website
            npm install --no-audit --no-fund
            npx next build
            sudo systemctl restart yance-website'
      - name: Health check
        run: |
          sleep 8
          curl -fsS "${{ vars.API_HEALTH_URL || 'https://api.yance.ai/health' }}" | grep -q '"status":"ok"'
          curl -fsS "${{ vars.SITE_URL || 'https://www.yance.ai/' }}" -o /dev/null
