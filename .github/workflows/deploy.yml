name: Release candidate verification

# Preparing an artifact is not permission to activate production. Production
# requires the evidence and explicit approval in docs/release-runbook.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and package without production access
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: yance
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: yance_release_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yance -d yance_release_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://yance:ci_password@localhost:5432/yance_release_test
      YANCE_TEST_DATABASE_ACK: yance_release_test
      EMAIL_ENABLED: "false"
      LLM_DEFAULT_PROVIDER: mock
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -c yance-ai/constraints-release.txt -e 'yance-ai[dev]'
      - name: Verify backend
        working-directory: yance-ai
        run: |
          ruff check app tests alembic
          python -m compileall -q app
          python scripts/export_openapi.py --check
          alembic upgrade head
          alembic check
          pytest --cov=app --cov-fail-under=50
          python evals/run_evals.py run --no-persist
      - name: Verify frontend
        working-directory: website
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run typecheck
          npm run test:unit
          npm run build
      - name: Package exact tracked source
        run: |
          git archive --format=tar.gz --output "$RUNNER_TEMP/yance-${GITHUB_SHA}.tar.gz" HEAD yance-ai website docs
          sha256sum "$RUNNER_TEMP/yance-${GITHUB_SHA}.tar.gz" > "$RUNNER_TEMP/yance-${GITHUB_SHA}.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/yance-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/yance-${{ github.sha }}.sha256
          retention-days: 14
