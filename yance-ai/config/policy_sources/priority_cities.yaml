notes: |
  首批重点覆盖城市（30 个）。选择方法为多指标可核验资料 + 区域覆盖校准，
  不宣称存在官方“全国科创前 30 名”排名。指标线索：
    1. 研发投入：各市统计局年度国民经济和社会发展统计公报、科技经费投入统计公报；
    2. 科技企业与产业集群：工信部专精特新“小巨人”企业名单、科技部火炬中心高新区评价、
       各市高新技术企业与科技型中小企业入库公告；
    3. 创新成果：世界知识产权组织（WIPO）全球创新指数（GII）科技集群排名；
    4. 企业政策需求：本地上市与规上工业结构、申报通知密度；
    5. 区域覆盖：31 个省级行政区均有代表城市，兼顾东北、西部与中部。
  直辖市（北京、上海、天津、重庆）的省级与城市级共用同一官方来源，
  在来源目录中只登记一次并标记 shared_jurisdiction，不重复采集。

